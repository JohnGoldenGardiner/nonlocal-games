[project]
name = "nonlocal-games"
version = "0.1.0"
description = "Tools for working with nonlocal games"
readme = "README.md"
authors = [
    { name = "John Gardiner", email = "johngoldengardiner@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "toqito>=1.3.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
